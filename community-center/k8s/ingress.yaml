# Generated by the Corpo Valley portal from your enabled capabilities. One
# Ingress, path-routed to the per-capability Services:
#   /mcp   → {{SLUG}}-mcp     (only if the MCP capability is on)
#   /api   → {{SLUG}}-api     (only if the database capability is on)
#   /files → {{SLUG}}-files   (only if the storage capability is on)
#   /      → {{SLUG}}         (the website — always)
# Don't hand-edit — toggle capabilities in the portal.
#
# auth-url gates every request through the portal's project-access check:
# anonymous visitors bounce to login (auth-signin), signed-in members without
# `read` on this project get 403 at the edge, and allowed requests reach your
# containers carrying the trusted identity headers (auth-response-headers):
#   X-CV-User-Id, X-CV-User-Email, X-CV-Perm (read|write|admin)
# nginx overwrites any client-supplied copies of those headers, so your code
# may trust them as-is — see ACCESS.md for the standard.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{SLUG}}
  namespace: {{SLUG}}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "{{CV_PORTAL_INTERNAL_URL}}/access/site/{{SLUG}}"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-CV-User-Id, X-CV-User-Email, X-CV-Perm"
    nginx.ingress.kubernetes.io/auth-signin: "{{CV_PORTAL_LOGIN_URL}}"
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: "return_to"
spec:
  ingressClassName: nginx
  rules:
    - host: {{SLUG}}.{{CV_PROJECTS_DOMAIN}}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}-mcp
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}-api
                port:
                  number: 80
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}-files
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}
                port:
                  number: 80
