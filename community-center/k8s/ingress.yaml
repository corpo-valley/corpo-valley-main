# Generated by the Corpo Valley portal from your enabled capabilities. One
# Ingress, path-routed to the per-capability Services:
#   /mcp  → {{SLUG}}-mcp   (only if the MCP capability is on)
#   /api  → {{SLUG}}-api   (only if the database capability is on)
#   /     → {{SLUG}}       (the website — always)
# Don't hand-edit — toggle capabilities in the portal.
#
# auth-url gates every request through Kratos's /sessions/whoami: nginx
# forwards the request cookies, Kratos returns 200 for a valid session and 401
# otherwise. Unauthenticated browsers are bounced to portal login via
# auth-signin. The forwarded Kratos cookie also reaches the backend containers,
# where the database/mcp capabilities re-validate it to identify the caller.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{SLUG}}
  namespace: {{SLUG}}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "{{CV_KRATOS_PUBLIC_URL}}/sessions/whoami"
    nginx.ingress.kubernetes.io/auth-signin: "{{CV_PORTAL_LOGIN_URL}}"
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: "return_to"
spec:
  ingressClassName: nginx
  rules:
    - host: {{SLUG}}.{{CV_PROJECTS_DOMAIN}}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}-mcp
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}
                port:
                  number: 80
