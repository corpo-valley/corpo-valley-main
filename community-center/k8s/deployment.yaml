        - name: mcp
          image: {{CV_REGISTRY}}/{{OWNER}}/{{REPO}}:bootstrap
          imagePullPolicy: IfNotPresent
          command: ["node", "mcp/server.js"]
          ports:
            - name: http-mcp
              containerPort: 9000
          env:
            # Same cross-capability env as static-site (see comments there).
            - name: PORT
