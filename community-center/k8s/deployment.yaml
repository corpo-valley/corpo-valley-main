            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_BUCKET
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_FORCE_PATH_STYLE
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
