# Templated + generated: {{OWNER}}, {{REPO}}, {{SLUG}} are substituted by the
# Corpo Valley portal. The portal REGENERATES this file from your enabled
# capabilities — one container per capability, all from the same image. Don't
# hand-edit the container list; toggle capabilities in the portal (or via the
# `set_capabilities` MCP tool) and the platform rewrites this file.
#
# This reference copy shows ALL capabilities enabled. In a generated file the
# DATABASE_URL / S3_* entries appear only when their capability is on (so the
# referenced `postgres` / `garage` Secret always exists) — but when a
# capability IS on, its creds are projected into EVERY container, not just
# the one that serves it.
#
# The image tag is immutable: every push to `main` runs the Build workflow,
# which timestamps a new tag (YYYYMMDDHHMMSS), pushes one image to the
# in-cluster registry, and asks the portal to pin every container below to
# that tag. `bootstrap` is the placeholder before the first build runs.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SLUG}}
  namespace: {{SLUG}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{SLUG}}
  template:
    metadata:
      labels:
        app: {{SLUG}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static-site
          image: {{CV_REGISTRY}}/{{OWNER}}/{{REPO}}:bootstrap
          imagePullPolicy: IfNotPresent
          command: ["node", "static-site/server.js"]
          ports:
            - name: http-site
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Per-user isolation by default. The portal sets this to "true"
            # when the project's "data is shared across users" box is ticked.
            - name: CV_SHARED
              value: "false"
            # Cross-capability credentials: EVERY container in the pod gets
            # the creds of every enabled stateful capability, not just the one
            # it serves — same image, one pod, one author — so e.g. the
            # storage server can record a download in the database. Only
            # DATABASE_URL is projected from the `postgres` Secret (keeps
            # POSTGRES_PASSWORD out of each process's environ and crash
            # dumps), and the six S3_* keys from the `garage` Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_ENDPOINT
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_BUCKET
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_FORCE_PATH_STYLE
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              subPath: static-site
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-site
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-site
            initialDelaySeconds: 15
            periodSeconds: 30
        - name: database
          image: {{CV_REGISTRY}}/{{OWNER}}/{{REPO}}:bootstrap
          imagePullPolicy: IfNotPresent
          command: ["node", "database/server.js"]
          ports:
            - name: http-api
              containerPort: 3000
          env:
            # Same cross-capability env as static-site (see comments there).
            - name: PORT
              value: "3000"
            - name: CV_SHARED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garage
