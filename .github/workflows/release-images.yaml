# Manually publish a versioned RELEASE of the public Corpo Valley container
# images to GHCR, and (optionally) cut a matching GitHub Release.
#
# This is distinct from build-images.yaml: that one auto-builds on every push to
# main and tags `latest` + `YYYYMMDD-<sha>` (rolling dev images). This workflow
# is operator-triggered and stamps an immutable, human-chosen version tag (e.g.
# v1.4.0) onto the public images — the thing you point a production deploy at.
#
# Run it from the Actions tab ("Run workflow") and supply a version. As with
# build-images.yaml, this repo does NOT bump deployment manifests — the
# corpo-valley-chart consumer owns `image.tags.<component>` and is bumped
# separately.
#
# Follows the GHCR publishing pattern from
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images

name: Release Container Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.4.0 (becomes the image tag)'
        required: true
        type: string
      apps:
        description: 'Comma-separated apps to release'
        required: false
        default: 'portal,mcp-gateway'
        type: string
      mark_latest:
        description: 'Also tag the images :latest'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create a GitHub Release + git tag for this version'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  GHCR_NAMESPACE: corpo-valley
  IMAGE_PREFIX: corpo-valley-

# Don't let two releases of the same version run concurrently.
concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      apps: ${{ steps.vars.outputs.apps }}
    steps:
      - name: Validate inputs and build matrix
        id: vars
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          # Require a semver-ish tag, optionally v-prefixed (e.g. v1.4.0, 1.4.0-rc.1).
          if ! echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not a valid semver tag (expected e.g. v1.4.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # CSV -> JSON array for the build matrix.
          APPS=$(echo "${{ github.event.inputs.apps }}" \
            | tr ',' '\n' | tr -d ' ' \
            | jq -R . | jq -s -c 'map(select(length > 0))')
          if [ "$APPS" = "[]" ]; then
            echo "::error::no apps specified"
            exit 1
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION for apps: $APPS"

  release-build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # a release is all-or-nothing; don't publish a partial set
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine source directory
        id: source
        run: |
          set -euo pipefail
          CONTEXT_FILE="containers/${{ matrix.app }}/context.txt"
          if [ -f "$CONTEXT_FILE" ]; then
            echo "dir=$(tr -d '\n' < "$CONTEXT_FILE")" >> "$GITHUB_OUTPUT"
          elif [ -d "typescript/${{ matrix.app }}" ]; then
            echo "dir=typescript/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          elif [ -d "python/${{ matrix.app }}" ]; then
            echo "dir=python/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no source directory for ${{ matrix.app }}"
            exit 1
          fi
          if [ ! -f "containers/${{ matrix.app }}/Dockerfile" ]; then
            echo "::error::containers/${{ matrix.app }}/Dockerfile not found"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ github.event.inputs.mark_latest }}

      - name: Build platforms
        id: platforms
        run: |
          PLATFORM_FILE="containers/${{ matrix.app }}/platforms.txt"
          if [ -f "$PLATFORM_FILE" ]; then
            echo "platforms=$(tr '\n' ',' < "$PLATFORM_FILE" | sed 's/,$//')" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v5
        with:
          context: ${{ steps.source.outputs.dir }}
          file: containers/${{ matrix.app }}/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Corpo Valley ${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "### Released ${{ matrix.app }} @ ${{ needs.prepare.outputs.version }}"
            echo ""
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.app }}:${{ needs.prepare.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [prepare, release-build]
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the tag + GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APPS: ${{ needs.prepare.outputs.apps }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists"
            exit 1
          fi
          NOTES="Public container images for \`$VERSION\`:"$'\n'
          for app in $(echo "$APPS" | jq -r '.[]'); do
            NOTES+=$'\n'"- \`${REGISTRY}/${GHCR_NAMESPACE}/${IMAGE_PREFIX}${app}:${VERSION}\`"
          done
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$NOTES"
