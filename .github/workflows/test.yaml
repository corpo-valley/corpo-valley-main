name: Test

# Unit tests + typecheck for the TypeScript services, and the mirrored-file
# drift check. The image builds only run `tsc`; this is the gate that catches
# logic regressions in the MCP auth path.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-sync:
    name: Mirrored files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-shared-sync.sh

  unit:
    name: ${{ matrix.app }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, mcp-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships Node 22; the image builders are on Node 24 (both
      # LTS). No setup-node so this stays within the actions the repo already uses
      # (the repo requires SHA-pinned actions).
      - name: Install, typecheck, test
        working-directory: typescript/${{ matrix.app }}
        run: |
          node --version && npm --version
          npm ci --ignore-scripts
          npx tsc --noEmit -p .
          npm test
